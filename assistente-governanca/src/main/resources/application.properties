spring.application.name=assistente-governanca

# Configurações do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/governanca_db
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
jwt.secret=${JWT_SECRET}